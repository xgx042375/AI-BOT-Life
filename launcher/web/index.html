<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>QQ AI 启动器 · 简洁控制台</title>
	<!-- 通用默认主页（generic 皮肤样板）：零图片素材 / 零外部资源 / 零第三方 IP。
	     调色板变量来自 skins/generic/palette.css（--bg/--fg/--accent/--muted）。
	     与 PS 的通信契约见 docs/皮肤包接口规范-v1.md。 -->
	<link rel="stylesheet" href="skins/generic/palette.css">
	<link rel="stylesheet" href="home.css?v=2">
</head>
<body>
	<!-- 操作遮罩：显隐驱动 = PS ExecuteScriptAsync 直呼 window.showWebBlock/hideWebBlock + state.json 轮询 op.active -->
	<div id="web-blocker">
		<div id="web-warnbar">
			<div class="wb-core"><span class="wb-icon">⚠</span><span class="wb-text">正在执行操作…</span></div>
		</div>
	</div>

	<header class="topbar">
		<div class="brand">◈ QQ AI 启动器 <span class="brand-sub">简洁控制台</span></div>
		<div class="top-actions">
			<span id="clock" class="clock">--:--:--</span>
			<button id="btn-gal" class="btn ghost" type="button">GAL 页</button>
		</div>
	</header>

	<main>
		<section id="sec-status" class="card">
			<h2>运行状态</h2>
			<div class="status-row">
				<img id="portrait" class="portrait" alt="" hidden>
				<div class="status-main">
					<div class="lamps">
						<div class="lamp" id="lamp-engine"><i class="dot"></i><span class="lamp-name">推理引擎</span><span class="lamp-state">未知</span></div>
						<div class="lamp" id="lamp-embed"><i class="dot"></i><span class="lamp-name">记忆服务</span><span class="lamp-state">未知</span></div>
						<div class="lamp" id="lamp-napcat"><i class="dot"></i><span class="lamp-name">NapCat</span><span class="lamp-state">未知</span></div>
						<div class="lamp" id="lamp-bot"><i class="dot"></i><span class="lamp-name">机器人</span><span class="lamp-state">未知</span></div>
					</div>
					<dl class="life">
						<div><dt>当前场景</dt><dd id="life-scene">—</dd></div>
						<div><dt>正在</dt><dd id="life-doing">—</dd></div>
						<div><dt>心情</dt><dd id="life-mood">—</dd></div>
						<div><dt>计划</dt><dd id="life-plan">—</dd></div>
						<div><dt>心跳</dt><dd id="life-wake">—</dd></div>
						<div><dt>当前人设</dt><dd id="life-persona">—</dd></div>
					</dl>
					<p id="dialog" class="dialog">等待指令…</p>
				</div>
			</div>
		</section>

		<section id="sec-control" class="card">
			<h2>控制</h2>
			<div class="ctrl-row">
				<button id="btn-start" class="btn primary" type="button">启动全部</button>
				<button id="btn-stop" class="btn danger" type="button">停止全部</button>
				<button id="btn-stopbot" class="btn" type="button">仅停机器人</button>
				<button id="btn-exit" class="btn ghost" type="button">退出启动器</button>
			</div>
			<div class="ctrl-row">
				<button id="btn-cfg" class="btn ghost" type="button">设置（皮肤/模型）</button>
				<button id="btn-plugins" class="btn ghost" type="button">插件</button>
				<button id="btn-log" class="btn ghost" type="button">日志</button>
				<button id="btn-state" class="btn ghost" type="button">状态</button>
			</div>
			<p class="hint" id="ctrl-msg"></p>
		</section>

		<section id="sec-persona" class="card">
			<h2>人设</h2>
			<div id="card-grid" class="card-grid"></div>
			<p class="hint" id="grid-hint" hidden>（暂无人设卡数据——等待启动器 state.json 提供）</p>
		</section>
	</main>

	<footer class="foot">通用皮肤样板 · generic · launcher-skin-v1</footer>

	<!-- 人设详情弹层 -->
	<div id="detail-layer" hidden>
		<div id="detail-box">
			<button id="detail-close" class="btn ghost sm" type="button">✕</button>
			<div class="detail-body">
				<div class="detail-imgbox"><img id="detail-img" alt=""></div>
				<div class="detail-info">
					<div class="detail-uni" id="detail-uni"></div>
					<div class="detail-name" id="detail-name"></div>
					<div class="detail-meta"><span id="detail-stars" class="stars"></span><span id="detail-cls" class="cls-chip"></span></div>
					<p id="detail-desc"></p>
					<button id="detail-set" class="btn primary" type="button">设为启动人设</button>
					<p class="hint" id="detail-msg"></p>
				</div>
			</div>
		</div>
	</div>

	<script src="app.js?v=3"></script>
</body>
</html>
