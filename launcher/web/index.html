<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>QQ AI 启动器 · 简洁控制台</title>
	<!-- 通用默认主页（generic 皮肤样板）：零图片素材 / 零外部资源 / 零第三方 IP。
	     调色板变量来自 skins/generic/palette.css（--bg/--fg/--accent/--muted）。
	     与 PS 的通信契约见 docs/皮肤包接口规范-v1.md。

	     2026-09-12 分层去重（用户实测：顶部按钮与主页按钮重复、多出一个不一样的干员页）：
	     本页**只做两件事**——① 只读总览（服务灯 + 生活状态 + 台词）；② 皮肤独有/框架没有的入口。
	     不重复摆：启动/停止（顶栏 ▶ ■ 是一等公民）、设置/内容包/运行状态/日志/组件/关于（顶栏导航）、
	     人设卡网格与"设为启动人设"（框架「干员」页是唯一数据面，含卡片图/详情/切换）。
	     理由：同一个动作两处入口 → 状态会不同步（一边转圈一边还写着"启动"）；
	     同一批数据两套界面 → 用户要学两遍。皮肤要展示人设只许**只读 + 跳转**框架页。
	     皮肤作者请注意：这条是规范，不是本样板的个人偏好（规范 §8）。 -->
	<link rel="stylesheet" href="skins/generic/palette.css">
	<link rel="stylesheet" href="home.css?v=3">
</head>
<body>
	<!-- 操作遮罩：显隐驱动 = PS ExecuteScriptAsync 直呼 window.showWebBlock/hideWebBlock + state.json 轮询 op.active -->
	<div id="web-blocker">
		<div id="web-warnbar">
			<div class="wb-core"><span class="wb-icon">⚠</span><span class="wb-text">正在执行操作…</span></div>
		</div>
	</div>

	<main>
		<section id="sec-status" class="card">
			<h2>运行状态</h2>
			<div class="status-row">
				<img id="portrait" class="portrait" alt="" hidden>
				<div class="status-main">
					<div class="lamps">
						<div class="lamp" id="lamp-engine"><i class="dot"></i><span class="lamp-name">推理引擎</span><span class="lamp-state">未知</span></div>
						<div class="lamp" id="lamp-embed"><i class="dot"></i><span class="lamp-name">记忆服务</span><span class="lamp-state">未知</span></div>
						<div class="lamp" id="lamp-napcat"><i class="dot"></i><span class="lamp-name">NapCat</span><span class="lamp-state">未知</span></div>
						<div class="lamp" id="lamp-bot"><i class="dot"></i><span class="lamp-name">机器人</span><span class="lamp-state">未知</span></div>
					</div>
					<dl class="life">
						<div><dt>当前场景</dt><dd id="life-scene">—</dd></div>
						<div><dt>正在</dt><dd id="life-doing">—</dd></div>
						<div><dt>心情</dt><dd id="life-mood">—</dd></div>
						<div><dt>计划</dt><dd id="life-plan">—</dd></div>
						<div><dt>心跳</dt><dd id="life-wake">—</dd></div>
						<div><dt>当前人设</dt><dd id="life-persona">—</dd></div>
					</dl>
					<p id="dialog" class="dialog">等待指令…</p>
				</div>
			</div>
			<p class="hint">只读总览：服务灯与生活状态每秒自动刷新。服务详情与心跳时间线见顶部「运行状态」页。</p>
		</section>

		<section id="sec-entry" class="card">
			<h2>入口</h2>
			<div class="ctrl-row">
				<button id="btn-ope" class="btn primary" type="button">干员一览</button>
				<button id="btn-gal" class="btn" type="button">进入 GAL 页</button>
				<button id="btn-exit" class="btn ghost" type="button">退出启动器</button>
			</div>
			<p class="hint">启动 / 停止在窗口顶部工具栏；设置、内容包、干员、运行状态、日志、组件、关于见顶部导航。
				框架已提供的一等公民操作，皮肤不再重复摆一份——同一个动作两处入口，状态迟早对不上。</p>
		</section>
	</main>

	<script src="app.js?v=4"></script>
</body>
</html>
